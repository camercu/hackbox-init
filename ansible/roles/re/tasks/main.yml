---
- name: "Install RE apt packages: {{ apt.install | join(', ') }}"
  ansible.builtin.apt:
    name: "{{ apt.install }}"
    state: latest
    update_cache: true
  tags:
    - apt
    - update
    - re

- name: "Install RE python packages: {{ pip.install | join(', ') }}"
  become: true
  become_user: "{{ user }}"
  ansible.builtin.pip:
    name: "{{ pip.install }}"
    state: latest
  tags:
    - pip
    - update
    - re

- name: Install pwndbg
  become: true
  become_user: "{{ user }}"
  tags:
    - re
    - pwndbg
  block:
    # No version pin: track pwndbg's default branch.
    - name: Download pwndbg # noqa: latest[git]
      ansible.builtin.git:
        repo: "{{ pwndbg.repo }}"
        dest: "{{ pwndbg.dir }}"
    - name: Check if pwndbg already in use
      ansible.builtin.command:
        cmd: grep pwndbg ~/.gdbinit
      register: pwndbg_inuse
      changed_when: false
      failed_when: false
    - name: Set pwndbg installer as executable
      ansible.builtin.file:
        path: "{{ pwndbg.dir }}/setup.sh"
        mode: '0755'
    - name: Install pwndbg
      ansible.builtin.command:
        chdir: "{{ pwndbg.dir }}"
        cmd: "./setup.sh"
      when: "'pwndbg' not in pwndbg_inuse.stdout"
      changed_when: true # `when` already skips hosts using pwndbg
