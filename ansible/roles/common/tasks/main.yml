---
# `user` comes from the environment: root when the playbook runs as root
# without sudo, empty when neither SUDO_USER nor USER is set. Root's home is
# /root, not /home/root, and anything else lands files in a wrong home.
# The pattern is Debian's default NAME_REGEX for login names.
- name: Check the target user is a normal login name
  tags:
    - always
  ansible.builtin.assert:
    that:
      - user is match('^[a-z][-a-z0-9_]*$')
      - user != 'root'
    fail_msg: >-
      Target user '{{ user }}' is root or not a valid login name. Run
      bootstrap.sh as your normal user, or pass -e user=NAME.

# Tagged `always`: later tasks in any tag (apt, go, uv, pentest) read these.
- name: Get (normalized) CPU architecture
  tags:
    - always
  ansible.builtin.set_fact:
    cpu_arch1: >-
      {% if ansible_facts.architecture in ['x86_64', 'amd64'] %}
        amd64
      {% elif ansible_facts.architecture in ['aarch64', 'arm64'] %}
        arm64
      {% else %}
        unsupported
      {% endif %}
    cpu_arch2: >-
      {% if ansible_facts.architecture in ['x86_64', 'amd64'] %}
        x86_64
      {% elif ansible_facts.architecture in ['aarch64', 'arm64'] %}
        aarch64
      {% else %}
        unsupported
      {% endif %}

- name: "Ensure target user exists: {{ user }}"
  ansible.builtin.user:
    name: "{{ user }}"
    shell: /bin/zsh # way better than vanilla bash
    groups: sudo
    append: true # don't remove user from groups not listed in 'groups'
    generate_ssh_key: true
    update_password: on_create # keep user's password if already set
    password: "{{ 'changeme' | password_hash('sha512', 65536 | random(seed=user) | string) }}"

- name: Create XDG Directories
  ansible.builtin.import_tasks:
    file: xdg_dirs.yml

# To only regenerate ssh keys once per host, we touch a file when done.
# If the file exists, don't do regeneration routine
- name: Check for ssh-key touchfile
  ansible.builtin.stat:
    path: "{{ sshkey_touchfile }}"
  register: sshtf
  tags:
    - ssh

- name: Regenerate host ssh keys
  when: not sshtf.stat.exists
  tags:
    - ssh
  block:
    - name: Ensure openssh-server installed
      ansible.builtin.apt:
        name: openssh-server
        state: latest
        update_cache: true
    - name: Find existing ssh keys
      ansible.builtin.find:
        paths: "/etc/ssh"
        patterns: "ssh_host_*"
      register: sshkeys
    - name: Delete old ssh keys
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ sshkeys.files }}"
    - name: Generate new host ssh keys
      ansible.builtin.command:
        cmd: dpkg-reconfigure openssh-server
        creates: /etc/ssh/ssh_host_rsa_key
    - name: Restart ssh server
      ansible.builtin.service:
        name: ssh
        state: restarted
    - name: Create ssh-key touchfile
      ansible.builtin.file:
        path: "{{ sshkey_touchfile }}"
        state: touch
        mode: '0640'

- name: Apt full-upgrade
  ansible.builtin.apt:
    upgrade: full
    update_cache: true
    autoclean: true
    autoremove: true
  tags:
    - apt
    - update

- name: Include Apt deb-src repos
  when: ansible_facts.distribution == "Kali"
  tags:
    - apt
  block:
    - name: Add Kali deb-src repo
      ansible.builtin.deb822_repository:
        name: kali-src
        types: deb-src
        uris: http://http.kali.org/kali
        suites: kali-rolling
        components:
          - main
          - contrib
          - non-free
          - non-free-firmware
        signed_by: /usr/share/keyrings/kali-archive-keyring.gpg
    # apt_repository (deprecated) wrote this one-line file; a second source
    # for the same repo makes apt warn about duplicate entries.
    - name: Remove the old one-line deb-src file
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/http_kali_org_kali.list
        state: absent

- name: Install Apt tools for adding repos
  ansible.builtin.apt:
    name: "{{ apt.pre_install }}"
    state: latest
    update_cache: true
  tags:
    - apt
    - update

- name: Add VSCode Apt Repo
  ansible.builtin.deb822_repository:
    name: vscode
    uris: https://packages.microsoft.com/repos/code
    signed_by: https://packages.microsoft.com/keys/microsoft.asc
    types: deb
    suites: stable
    components: main
    architectures:
      - amd64
      - arm64
      - armhf
  tags:
    - vscode

# git-credential-manager comes from nix (dotfiles). Earlier runs installed
# it with a .NET SDK under /usr/local; remove both, about 1.2 GB.
- name: Remove the old .NET git-credential-manager install
  tags:
    - gcm
  ansible.builtin.file:
    path: "{{ legacy_dotnet_root }}{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/git-credential-manager
    - /usr/local/bin/.store
    - /usr/local/bin/dotnet
    - /usr/local/share/dotnet
    - /etc/profile.d/dotnet.sh

- name: Get foreign dpkg architectures
  ansible.builtin.command: dpkg --print-foreign-architectures
  register: dpkg_architectures
  changed_when: false # never shows as creating a change
  tags:
    - apt
# - debug:
#     var: dpkg_architectures.stdout
- name: Add i386 architecture to dpkg
  ansible.builtin.command: dpkg --add-architecture i386
  changed_when: true # `when` already skips hosts that have i386
  when:
    - cpu_arch1 | trim == 'amd64'
    - "'i386' not in dpkg_architectures.stdout"
  tags:
    - apt

- name: "Install apt packages: {{ apt.install | join(', ') }}"
  ansible.builtin.apt:
    name: "{{ apt.install }}"
    state: latest
    update_cache: true
  notify: Update database for locate command
  tags:
    - apt
    - update

# A system package, so Ghostty uses the system's GL and shows in the menu.
# Dotfiles leave it out of the nix profile on Kali hosts (system-ghostty.nix).
- name: Install Ghostty
  tags:
    - ghostty
    - apt
  vars:
    common_ghostty_deb: "ghostty_{{ ghostty.version }}_{{ cpu_arch1 | trim }}_forky.deb"
  block:
    - name: "Download Ghostty package: {{ common_ghostty_deb }}"
      ansible.builtin.get_url:
        url: "https://github.com/mkasberg/ghostty-ubuntu/releases/download/{{ ghostty.release }}/{{ common_ghostty_deb }}"
        dest: "/tmp/{{ common_ghostty_deb }}"
        checksum: "sha256:{{ ghostty.sha256[cpu_arch1 | trim] }}"
        mode: '0644'
    - name: Install Ghostty package
      ansible.builtin.apt:
        deb: "/tmp/{{ common_ghostty_deb }}"

- name: Install Firefox add-ons by policy
  tags:
    - firefox
  block:
    - name: Read Kali's Firefox policies
      ansible.builtin.slurp:
        src: "{{ firefox_distribution_policies }}"
      register: common_kali_policies
      failed_when: false

    - name: Create Firefox policies directory
      ansible.builtin.file:
        path: "{{ firefox_policies_dir }}"
        state: directory
        mode: "0755"

    - name: Write Firefox policies with add-ons
      vars:
        common_kali: >-
          {{ (common_kali_policies.content | default('e30=') | b64decode
              | from_json).policies | default({}) }}
        common_extensions: >-
          {% set out = {} %}{% for id, slug in firefox_extensions.items() %}{%
            set _ = out.update({id: {
              'installation_mode': 'normal_installed',
              'install_url': 'https://addons.mozilla.org/firefox/downloads/latest/'
                ~ slug ~ '/latest.xpi'}}) %}{% endfor %}{{ out }}
      ansible.builtin.copy:
        dest: "{{ firefox_policies_dir }}/policies.json"
        content: >-
          {{ {'policies': common_kali | combine(
               {'ExtensionSettings': common_extensions}, recursive=True)}
             | to_nice_json }}
        mode: "0644"

# Nix is a system install (needs root), so do it here rather than let the
# dotfiles installer prompt for sudo as the user.
- name: Install Nix (Determinate installer)
  tags:
    - nix
    - dotfiles
  block:
    - name: Fetch Nix installer
      ansible.builtin.get_url:
        url: "{{ nix.installer_url }}"
        dest: /tmp/nix-installer.sh
        mode: '0755'
    - name: Run Nix installer
      ansible.builtin.command:
        cmd: /tmp/nix-installer.sh install --no-confirm
        creates: "{{ nix.daemon_profile }}"
    # An earlier version linked /etc/dbus-1/session.conf to Debian's
    # /usr/share/dbus-1/session.conf. That file includes the /etc one, so
    # every session bus failed with "Circular inclusion" and desktop login
    # broke ("unable to contact settings server"). Remove the link.
    - name: Check for the old looping dbus session config link
      ansible.builtin.stat:
        path: /etc/dbus-1/session.conf
      register: common_etc_dbus_session_conf
    - name: Remove the old looping dbus session config link
      ansible.builtin.file:
        path: /etc/dbus-1/session.conf
        state: absent
      when:
        - common_etc_dbus_session_conf.stat.islnk | default(false)
        - common_etc_dbus_session_conf.stat.lnk_target == '/usr/share/dbus-1/session.conf'
    # Desktop login needs a session bus. Fail here, not at the next login.
    - name: Check a dbus session bus can start
      ansible.builtin.command:
        cmd: timeout 10 /usr/bin/dbus-run-session -- true
      changed_when: false

# The dotfiles installer links configs (stow) and, with USE_HOME_MANAGER=1,
# applies the Home Manager config whose hosts.tsv row matches `user@host`,
# else the bare `hostname -s`.
# It is idempotent, so run it every time to pick up dotfiles changes.
- name: Install dotfiles
  tags:
    - dotfiles
  block:
    # No version pin: clone the default branch once, never move it.
    - name: Download dotfiles repo # noqa: latest[git]
      become: true
      become_user: "{{ user }}"
      ansible.builtin.git:
        repo: "{{ dotfiles.repo }}"
        dest: "{{ dotfiles.dir }}"
        update: false # the user may have local work in it; `maintain` pulls
    # A logged-in desktop session gets the xfconf settings live; its xfconfd
    # would otherwise overwrite values written on a private bus at logout.
    # With no session, Debian's dbus-run-session provides the bus: Home
    # Manager then uses it instead of starting nix's dbus-daemon, which
    # finds no config on Debian.
    # install.sh reports no change status, so the task cannot say whether
    # it changed anything.
    - name: Run dotfiles installer with Home Manager # noqa: no-changed-when
      become: true
      become_user: "{{ user }}"
      ansible.builtin.shell:
        chdir: "{{ dotfiles.dir }}"
        # The socket file outlives a failed dbus.service, so ask the bus to
        # answer before using it.
        cmd: |
          . {{ nix.daemon_profile }}
          bus="unix:path=/run/user/$(id -u)/bus"
          if DBUS_SESSION_BUS_ADDRESS="$bus" dbus-send --session --print-reply \
              --dest=org.freedesktop.DBus /org/freedesktop/DBus \
              org.freedesktop.DBus.GetId >/dev/null 2>&1; then
            DBUS_SESSION_BUS_ADDRESS="$bus" ./install.sh
          else
            /usr/bin/dbus-run-session -- ./install.sh
          fi
      environment:
        USE_HOME_MANAGER: "1"
    # Links host GPU drivers for nix GUI apps (Ghostty). The script is
    # idempotent and its store path changes with the drivers: run every time.
    - name: Set up host GPU drivers for nix packages
      ansible.builtin.command:
        cmd: "{{ homedir }}/.nix-profile/bin/non-nixos-gpu-setup"
        removes: "{{ homedir }}/.nix-profile/bin/non-nixos-gpu-setup"
    # Dotfiles point the user's shells at the nix profile's terminal entries,
    # but sudo resets the environment. Compile xterm-ghostty into
    # /etc/terminfo, the local-admin dir every ncurses searches, for root.
    - name: Install xterm-ghostty terminfo system-wide
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          infocmp -x -A {{ homedir }}/.nix-profile/share/terminfo xterm-ghostty
          | tic -x -o /etc/terminfo -
        executable: /bin/bash
        creates: /etc/terminfo/x/xterm-ghostty
        removes: "{{ homedir }}/.nix-profile/share/terminfo/x/xterm-ghostty"

# On VMware, bootstrap.sh mounts the host's vm-share folder. Edit the
# dotfiles and this repo on the host and see the changes in the VM at once.
- name: Use the host's shared copies of dotfiles and hackbox-init
  tags:
    - dotfiles
    - vmshare
  ansible.builtin.include_tasks:
    file: vm_share_link.yml
    apply:
      tags:
        - dotfiles
        - vmshare
  loop:
    - .dotfiles
    - hackbox-init

- name: Install latest release of Golang
  tags:
    - go
    - golang
  block:
    - name: Check currently installed version of Go
      ansible.builtin.shell:
        cmd: "set -o pipefail && /usr/local/go/bin/go version | awk '{print $3}'"
        executable: /bin/bash
      register: installed_go_version
      changed_when: false
      failed_when: false
      become: true
      become_user: "{{ user }}"
    - name: Find latest release version of Go
      ansible.builtin.uri:
        method: GET
        url: "{{ go.version_url }}"
        follow_redirects: safe
        return_content: true
      register: latest_go_version
    - name: Remove old Go install (unarchive over it leaves stale files)
      ansible.builtin.file:
        path: /usr/local/go
        state: absent
      when: latest_go_version.json[0].version != installed_go_version.stdout
    - name: Download & Install latest version of Go
      ansible.builtin.unarchive:
        src: "https://golang.org/dl/{{ latest_go_version.json[0].version }}.linux-{{ cpu_arch1 | trim }}.tar.gz"
        dest: /usr/local
        remote_src: true
      when: latest_go_version.json[0].version != installed_go_version.stdout

- name: Install Rust
  become: true
  become_user: "{{ user }}"
  tags:
    - rust
  block:
    - name: "Check if Rust is installed for user {{ user }}"
      ansible.builtin.stat:
        path: "{{ homedir }}/.cargo"
      register: cargo_dir
    - name: Fetch rustup
      ansible.builtin.uri:
        url: https://sh.rustup.rs
        return_content: true
      when: not cargo_dir.stat.exists
      register: rustup_installer
    - name: Run rustup installer
      ansible.builtin.command:
        cmd: sh -s -- -y
        stdin: "{{ rustup_installer.content }}"
      changed_when: true # `when` already skips hosts that have ~/.cargo
      when: not cargo_dir.stat.exists

- name: "Install uv (pip replacement)"
  become: true
  become_user: "{{ user }}"
  ansible.builtin.unarchive:
    src: "https://github.com/astral-sh/uv/releases/latest/download/uv-{{ cpu_arch2 | trim }}-unknown-linux-gnu.tar.gz"
    dest: "{{ xdg_bin_home }}"
    remote_src: true
    extra_opts: [--strip-components=1] # extract without creating subdir
  notify: Update database for locate command
  tags:
    - uv
    - update

- name: Install Meslo Nerd fonts
  ansible.builtin.uri:
    url: "{{ item }}"
    dest: /usr/local/share/fonts/
    # uri saves the file under its decoded name, with spaces
    creates: "/usr/local/share/fonts/{{ item | basename | urldecode }}"
  loop:
    - https://github.com/romkatv/powerlevel10k-media/raw/master/MesloLGS%20NF%20Regular.ttf
    - https://github.com/romkatv/powerlevel10k-media/raw/master/MesloLGS%20NF%20Bold.ttf
    - https://github.com/romkatv/powerlevel10k-media/raw/master/MesloLGS%20NF%20Italic.ttf
    - https://github.com/romkatv/powerlevel10k-media/raw/master/MesloLGS%20NF%20Bold%20Italic.ttf
  notify: Refresh font cache
  tags:
    - zsh
    - fonts

- name: Install VSCode extensions
  become: true
  become_user: "{{ user }}"
  ansible.builtin.command:
    cmd: "code --install-extension {{ item }}"
    creates: "{{ homedir }}/.vscode/extensions/{{ item }}-*"
  loop: "{{ vscode.extensions }}"
  tags:
    - vscode

- name: Checking if reboot required
  ansible.builtin.command: test -f /var/run/reboot-required
  failed_when: false
  register: reboot_required
  changed_when: reboot_required.rc == 0
  notify: Rebooting machine
